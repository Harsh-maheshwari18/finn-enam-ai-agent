# Render Blueprint for FINN (free plan). See docs/deployment.md and docs/frontend.md.
services:
  - type: web
    name: finn-api
    runtime: python
    plan: free
    region: singapore              # nearest Render region to NSE
    branch: main
    buildCommand: pip install -r requirements.txt && python -m finn.snapshot verify
    startCommand: gunicorn finn.api:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60 --access-logfile -
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: FINN_SNAPSHOT
        value: snapshot/finn_snapshot.db
      - key: FINN_LLM_DISABLED
        value: "1"
      - key: FINN_CACHE_DIR
        value: /tmp/finn_raw
      # Exact-match CORS allowlist (comma-separated): the static web app's real URL, set in the dashboard once
      # Render assigns it. Never "*", and never guessed: finn-web.onrender.com belongs to someone else (2026-10-27).
      - key: FINN_CORS_ORIGINS
        sync: false
      # Token for /api/v1/diagnostics/connectivity (X-Finn-Diagnostics-Token). Generated by Render, shown only in
      # the dashboard; without it the live probe is disabled.
      - key: FINN_DIAG_TOKEN
        generateValue: true

  # The mobile web app as a static site: served from Render's CDN, so it does not sleep and can show a
  # "waking the server" state while the free API service cold-starts. The API also serves the same app at "/".
  - type: web
    name: finn-web
    runtime: static
    branch: main
    autoDeploy: true
    buildCommand: printf 'window.FINN_CONFIG = { apiBase: "%s" };\n' "$FINN_API_BASE" > web/config.js
    staticPublishPath: web
    envVars:
      - key: FINN_API_BASE
        value: https://finn-api-9z4q.onrender.com
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src https://finn-api-9z4q.onrender.com; base-uri 'none'; frame-ancestors 'none'; form-action 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Cache-Control
        value: no-cache
